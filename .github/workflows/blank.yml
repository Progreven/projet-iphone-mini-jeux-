name: Build Imposteur IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Afficher la version de Xcode
        run: xcodebuild -version

      - name: Compiler l'application iPhone sans signature
        working-directory: Imposteur-iPhone
        run: |
          xcodebuild \
            -project Imposteur.xcodeproj \
            -scheme Imposteur \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Fabriquer le fichier IPA
        working-directory: Imposteur-iPhone
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Imposteur.app Payload/
          zip -qry Jeux-Soiree-unsigned.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jeux-Soiree-IPA
          path: Imposteur-iPhone/Jeux-Soiree-unsigned.ipa
